  <script>
    document.querySelector(".theme-toggle").addEventListener("click", function () {
      var root = document.documentElement, chosen = root.getAttribute("data-theme");
      var dark = chosen ? chosen === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      root.setAttribute("data-theme", dark ? "light" : "dark");
      try { localStorage.setItem("mlfin-theme", dark ? "light" : "dark"); } catch (e) {}
    });
    /* "/" jumps to the search box: the page's own if it has one, else the sidebar's. */
    document.addEventListener("keydown", function (e) {
      if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey) return;
      var t = e.target;
      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
      var box = document.querySelector("[data-slash]") || document.querySelector(".nav-search input");
      e.preventDefault();
      if (box && box.offsetParent !== null) { box.focus(); box.select(); }
      else location.href = "search.html";
    });
  </script>
